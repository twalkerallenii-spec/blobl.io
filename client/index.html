<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blobl.io</title>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <meta name="description"
        content="Blobl.io: A strategic 2D multiplayer RTS game where you build and defend your base, capture resources, and outmaneuver opponents in tactical gameplay.">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <script type="module" src="src/index.js"></script>
</head>

<body>
    <!-- Menu-related containers -->
    <div id="menu-container">
        <div class="dialog" id="menu-dialog">
            <div class="menu-card">
                <h2>Couldn't Connect</h2>
                <p>The server might be starting up or temporarily unavailable.</p>
                <p>Try again in a moment!</p>
                <button id="menu-dialog-button">Okay</button>
            </div>
        </div>

        <div id="global-leaderboard" class="leaderboard"></div>

        <div id="game-title">
            <h1 class="title">Blobl<span>.io</span></h1>
            <p class="subtitle">Build, Battle, Dominate!</p>
        </div>
        <div class="menu-content-container">
            <div class="menu-content">
                <div class="player-settings">
                    <div class="menu-card">
                        <div class="player-input-container">
                            <input type="text" class="player-name-input" id="player-name" placeholder="Player Name"
                                maxlength="12">
                            <button class="play-button" id="play-button">Play</button>
                        </div>
                    </div>
                    <div class="menu-card settings-container">
                        <div class="menu-header">Gamemode</div>
                        <div id="gamemode-select">
                            <div class="gamemode selected">FFA</div>
                            <div class="gamemode disabled">Soon!</div>
                            <div class="gamemode disabled">Soon!</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Game Over Screen -->
    <div id="game-over-container">
        <div id="game-over-content">
            <h1><span>Killed by</span> <span id="game-over-killed-by">Eric</span></h1>
            <div id="game-over-stats">
                <p><strong>Score:</strong> <span id="game-over-score">0</span></p>
                <p><strong>Time:</strong> <span id="game-over-time-survived">0s</span></p>
            </div>
            <div class="actions">
                <button class="continue-button" id="continue-button">Continue</button>
            </div>

        </div>

    </div>

    <!-- Game-related containers -->
    <div id="game-container">
        <div id="game-settings">
            <div class="slider">
                <button>Settings</button>
                <img src="assets/arrow_right.svg"></img>
            </div>
            <div class="settings">
                <button id="game-settings-exit" class="exit-button">x</button>
                <h1>Settings</h1>
                <div class="theme-settings">
                    <p>Theme:</p>
                    <select id="theme-select">
                    </select>
                </div>
            </div>
        </div>
        <div id="game-metrics"></div>
        <div id="resource-container">
            <div id="power"></div>
            <div id="shield"></div>
        </div>
        <div id="upgrade-container">
            <h1></h1>
            <button id="upgrade-container-exit" class="exit-button">x</button>
            <div id="upgrade-tabs">
            </div>
            <div id="upgrade-list">
            </div>
            <div id="destroy-button">
                <p>Destroy</p>
                <p class="hotkey">[R]</p>
            </div>
        </div>
        <div id="chat-container">
            <div class="chat" id="chat">
                <div class="header">
                    <h3>Blobl Chat:</h3>
                    <button class="chat-move-button" id="chat-move-button">~</button>
                </div>

                <div id="chat-messages">
                    <div class="message"><span class="text">Welcome to Blobl.io</span></div>
                </div>
                <div class="actions">
                    <input type="text" class="chat-message-input" id="chat-message-input" placeholder="Message"
                        maxlength="64">
                    <button class="chat-button" id="chat-button">Send</button>
                </div>
            </div>
        </div>
        <div id="leaderboard-container"></div>
        <div id="minimap-container"></div>
        <div id="toolbar-container"></div>
        <div id="powerup-hud"></div>
        <button id="shop-button" title="Shop [B]">🛒</button>
        <div id="shop-container">
            <button id="shop-container-exit" class="exit-button">x</button>
            <h1>Shop</h1>
            <p class="shop-subtitle">Spend Power on powerups</p>
            <div id="shop-list"></div>
        </div>
</body>

</html>
